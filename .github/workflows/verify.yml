name: verify

on:
  push:
    # Autopilot/documentation metadata does not run the heavy runtime verify.
    # If a push changes any runtime/source/data/script/build/workflow file in
    # addition to these, the workflow still runs.
    paths-ignore:
      - '.reasonix/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
  pull_request:
    paths-ignore:
      - '.reasonix/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Forward the worker limit through verify's nested npm test command.
      - run: npm run verify -- -- --maxWorkers=1
