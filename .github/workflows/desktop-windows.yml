name: desktop-windows

on:
  push:
    branches: [ui/menu-integrity-animations, ui/load-game-globe, main, waffle913-interface-033, waffle913-v1-playable-shell-desktop, waffle913-a1-player-facing-recovery]
  pull_request:
    branches: [ui/menu-integrity-animations, ui/load-game-globe, main, waffle913-interface-033, waffle913-v1-playable-shell-desktop, waffle913-a1-player-facing-recovery]
  workflow_dispatch:

jobs:
  # Native persistence commands (save/settings) are unit-tested in Rust and run
  # separately from the ordinary TypeScript/Vitest `verify` workflow, so desktop
  # compatibility is never claimed from frontend-only CI success.
  native-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # `cargo test` compiles `tauri::generate_context!`, which embeds the built
      # frontend, so the frontend must be built first.
      - name: Build frontend
        run: npm run build

      - name: Native save/settings command tests
        run: cargo test
        working-directory: src-tauri
        env:
          CI: "true"

      - name: Validate optional read-only cursor probe
        shell: pwsh
        run: ./scripts/windows/Collect-AtlasCursorDiagnostic.ps1 -ValidateOnly

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ProjectAtlas (Tauri release)
        run: npm run tauri:build
        env:
          CI: "true"

      - name: Stage optional diagnostic companion
        shell: pwsh
        run: Copy-Item -LiteralPath scripts/windows/Collect-AtlasCursorDiagnostic.ps1 -Destination src-tauri/target/release/Collect-AtlasCursorDiagnostic.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: projectatlas-windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/Collect-AtlasCursorDiagnostic.ps1
          if-no-files-found: error
